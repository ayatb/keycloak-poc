services:

  # ==========================================================================
  # Apache Kafka Broker (KRaft mode - no Zookeeper needed)
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    container_name: keycloak
    environment:
      HOSTNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: localhost.idyatech.fr
      DEBUG: true
      DEBUG_PORT: "*:8787"
      KC_HTTP_MANAGEMENT_PORT: 9001
    command:
      - start
      - --http-port=8180
      - --https-certificate-file=/opt/keycloak/conf/ssl/cert.pem
      - --https-certificate-key-file=/opt/keycloak/conf/ssl/key.pem
      - --features=spiffe,client-auth-federated
      - --log-level=INFO,org.apache.http:DEBUG
      - --http-access-log-enabled=true
      - --import-realm
    ports:
      - "8180:8180"
      - "8443:8443"
      - "9001:9001"
      - "8787:8787"
    volumes:
      - keycloak:/opt/keycloak/data
      - ./keycloak/data/import:/opt/keycloak/data/import:ro
      - ./keycloak/ssl:/opt/keycloak/conf/ssl:ro
      - ./keycloak/truststores:/opt/keycloak/conf/truststores:ro
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9001" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ==========================================================================
  # AI Agent – JWT Authorization Grant demo
  # ==========================================================================
  ai-agent:
    build: ./ai-agent
    container_name: ai-agent
    environment:
      KC_BASE_URL: https://keycloak:8443/auth
      KC_HOSTNAME: localhost.idyatech.fr
      KC_USERNAME: ayat
      KC_PASSWORD: password
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak:
